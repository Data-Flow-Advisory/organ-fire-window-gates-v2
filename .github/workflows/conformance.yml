name: conformance

# Shadow-run the organ on its committed samples and report each verdict +
# self_metric to the job summary — report only, no action. Then run tests.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify decide() contract
        run: |
          python -c "
          import inspect
          from organ import decide
          params = list(inspect.signature(decide).parameters.keys())
          assert params[:2] == ['state', 'context'], params
          r = decide({}, {})
          assert set(r) == {'output', 'rationale', 'self_metric'}, set(r)
          c = r['self_metric']['confidence']
          assert 0.0 <= c <= 1.0, c
          # conservative on empty: every gate closed
          o = r['output']
          assert not any([o['stage_a_complete'], o['stage_b_complete'],
                          o['phase_2_unlocked'], o['phase_3_complete']])
          print('contract OK; empty-state confidence', c)
          "

      - name: Shadow-run organ on samples
        run: |
          set -euo pipefail
          echo '# Fire-Window-Gates Organ — Conformance' >> "$GITHUB_STEP_SUMMARY"
          if [ -d samples ]; then
            for s in samples/*.json; do
              echo "## $(basename "$s")" >> "$GITHUB_STEP_SUMMARY"
              out="$(ORGAN_INPUT="$s" python3 organ.py)"
              printf '```json\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo 'No samples/ directory found' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No non-stdlib imports
        run: |
          python -c "
          import ast
          tree = ast.parse(open('organ.py').read())
          mods = []
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  mods += [a.name.split('.')[0] for a in n.names]
              elif isinstance(n, ast.ImportFrom) and n.module:
                  mods.append(n.module.split('.')[0])
          allowed = {'typing', 'json', 'os', 'sys'}
          extern = sorted(set(mods) - allowed)
          assert not extern, f'non-stdlib imports: {extern}'
          print('stdlib-only OK; imports:', sorted(set(mods)))
          "

      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -v
